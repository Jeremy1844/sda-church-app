name: Deploy and Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-and-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the complete quality gate
        run: npm run check

      - name: Verify deployment input is committed and reproducible
        run: git diff --exit-code

      - name: Create the immutable release tag
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${TAG}"; then
            if [ "$(git rev-list -n 1 "${TAG}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag ${TAG} already points to another commit."
              exit 1
            fi
            echo "Tag ${TAG} already points to this commit."
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

      - name: Deploy GitHub Pages
        run: npm run deploy

name: Final Release Version Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  enforce-release-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify a strictly greater release version
        run: |
          git fetch --no-tags origin main
          npm run check:release-version -- origin/main

      - name: Verify synchronized version targets
        run: npm run version:check
